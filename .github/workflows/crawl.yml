name: crawl

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분(UTC 기준 = 한국시간 매시 7분)
  workflow_dispatch:
    inputs:
      send_test_mail:
        description: "시험 메일만 보내기 (수집은 하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집 및 알림
        run: python crawler.py
        env:
          SOURCES_CSV_URL: ${{ vars.SOURCES_CSV_URL }}
          KEYWORDS_CSV_URL: ${{ vars.KEYWORDS_CSV_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_MAIL: ${{ inputs.send_test_mail }}

      - name: 결과 저장
        run: |
          git config user.name "jobboard-bot"
          git config user.email "jobboard-bot@users.noreply.github.com"
          git add data docs/jobs.json
          git diff --cached --quiet || (git commit -m "update jobs" && git push)
